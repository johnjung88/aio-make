<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E8D6"/>
      <stop offset="100%" stop-color="#E8DAC4"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DEC0A4"/>
      <stop offset="100%" stop-color="#C4966A"/>
    </linearGradient>
    <filter id="ph"><feDropShadow dx="0" dy="20" stdDeviation="32" flood-opacity="0.5"/></filter>
    <filter id="badge"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="800" height="640" fill="url(#paper)"/>
  <!-- paper edge lines -->
  <rect x="0" y="0" width="800" height="1" fill="#1A1612" opacity="0.1"/>
  <rect x="0" y="639" width="800" height="1" fill="#1A1612" opacity="0.1"/>

  <!-- phone frame -->
  <g filter="url(#ph)">
    <rect x="278" y="40" width="204" height="420" rx="26" fill="#0E0D0B" stroke="#2A2520" stroke-width="1.5"/>
  </g>
  <!-- screen -->
  <rect x="290" y="70" width="180" height="362" fill="#FAFAF8"/>
  <!-- notch -->
  <rect x="342" y="70" width="56" height="10" rx="5" fill="#0E0D0B"/>

  <!-- page content inside phone -->
  <!-- hero product image -->
  <rect x="290" y="80" width="180" height="136" fill="url(#hero)"/>
  <!-- product bottle simplified -->
  <ellipse cx="380" cy="132" rx="18" ry="48" fill="#C8A24A" opacity="0.38"/>
  <rect x="372" y="88" width="16" height="10" rx="5" fill="#A08030" opacity="0.45"/>
  <!-- image overlay -->
  <rect x="290" y="164" width="180" height="52" fill="#FAFAF8" fill-opacity="0.3"/>

  <!-- content section -->
  <rect x="298" y="224" width="72" height="6" rx="2" fill="#1A1612" opacity="0.4"/>
  <rect x="298" y="236" width="150" height="14" rx="2" fill="#1A1612" opacity="0.78"/>
  <rect x="298" y="256" width="60" height="10" rx="2" fill="#C66060" opacity="0.7"/>
  <!-- divider -->
  <rect x="298" y="274" width="164" height="0.5" fill="#1A1612" opacity="0.12"/>
  <!-- features -->
  <rect x="298" y="284" width="96" height="6" rx="2" fill="#4B413A" opacity="0.36"/>
  <rect x="298" y="297" width="120" height="6" rx="2" fill="#4B413A" opacity="0.3"/>
  <rect x="298" y="310" width="80" height="6" rx="2" fill="#4B413A" opacity="0.26"/>
  <!-- review stars simulation -->
  <rect x="298" y="326" width="80" height="8" rx="4" fill="#C8A24A" opacity="0.55"/>
  <rect x="386" y="328" width="44" height="4" rx="2" fill="#7D7568" opacity="0.4"/>
  <!-- CTA -->
  <rect x="298" y="348" width="164" height="36" rx="3" fill="#1A1612"/>
  <rect x="340" y="361" width="80" height="10" rx="5" fill="#F4ECDC" opacity="0.6"/>
  <!-- bottom scrolled content hint -->
  <rect x="298" y="396" width="164" height="0.5" fill="#1A1612" opacity="0.1"/>
  <rect x="298" y="404" width="96" height="6" rx="2" fill="#4B413A" opacity="0.2"/>
  <rect x="298" y="414" width="130" height="6" rx="2" fill="#4B413A" opacity="0.16"/>
  <!-- home bar -->
  <rect x="346" y="418" width="68" height="4" rx="2" fill="#1A1612" opacity="0.2"/>

  <!-- left: floating metric badge -->
  <g filter="url(#badge)">
    <rect x="70" y="200" width="148" height="80" rx="3" fill="#F4ECDC"/>
  </g>
  <rect x="84" y="216" width="56" height="7" rx="2" fill="#7D7568" opacity="0.5"/>
  <rect x="84" y="230" width="120" height="16" rx="2" fill="#1A1612" opacity="0.7"/>
  <rect x="84" y="252" width="80" height="7" rx="2" fill="#C66060" opacity="0.55"/>

  <!-- left label column -->
  <rect x="70" y="320" width="1" height="120" fill="#C8A24A" opacity="0.28"/>
  <rect x="86" y="350" width="64" height="7" rx="2" fill="#1A1612" opacity="0.35"/>
  <rect x="86" y="364" width="96" height="10" rx="2" fill="#1A1612" opacity="0.55"/>
  <rect x="86" y="382" width="52" height="6" rx="2" fill="#C8A24A" opacity="0.5"/>

  <!-- right: floating scroll indicator + text -->
  <g filter="url(#badge)">
    <rect x="542" y="180" width="160" height="90" rx="3" fill="#0E0D0B" fill-opacity="0.85"/>
  </g>
  <rect x="554" y="196" width="48" height="7" rx="2" fill="#EFE9DD" opacity="0.5"/>
  <rect x="554" y="210" width="96" height="14" rx="2" fill="#C8A24A" opacity="0.7"/>
  <rect x="554" y="230" width="70" height="7" rx="2" fill="#B7B0A2" opacity="0.4"/>
  <rect x="554" y="244" width="50" height="7" rx="2" fill="#B7B0A2" opacity="0.3"/>
  <!-- scroll arrow -->
  <line x1="700" y1="220" x2="700" y2="240" stroke="#C8A24A" stroke-width="1.5" opacity="0.6"/>
  <polyline points="695,235 700,242 705,235" fill="none" stroke="#C8A24A" stroke-width="1.5" opacity="0.6"/>

  <!-- right label column -->
  <rect x="542" y="320" width="148" height="0.5" fill="#C8A24A" opacity="0.22"/>
  <rect x="542" y="336" width="108" height="9" rx="2" fill="#1A1612" opacity="0.45"/>
  <rect x="542" y="352" width="76" height="6" rx="2" fill="#4B413A" opacity="0.32"/>
  <rect x="542" y="366" width="100" height="6" rx="2" fill="#4B413A" opacity="0.26"/>

  <!-- bottom bar -->
  <rect x="60" y="568" width="680" height="0.5" fill="#1A1612" opacity="0.12"/>
  <rect x="60" y="584" width="100" height="7" rx="2" fill="#7D7568" opacity="0.45"/>
  <rect x="640" y="584" width="100" height="7" rx="2" fill="#7D7568" opacity="0.35"/>
</svg>
