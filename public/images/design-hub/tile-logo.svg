<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2010"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- outer decorative rings -->
  <circle cx="400" cy="250" r="220" fill="none" stroke="#C8A24A" stroke-width="0.5" opacity="0.15"/>
  <circle cx="400" cy="250" r="180" fill="none" stroke="#C8A24A" stroke-width="0.75" opacity="0.22"/>
  <circle cx="400" cy="250" r="140" fill="none" stroke="#C8A24A" stroke-width="1" opacity="0.3"/>

  <!-- main geometric mark -->
  <!-- diamond/rhombus -->
  <polygon points="400,80 560,250 400,420 240,250"
           fill="#C8A24A" fill-opacity="0.07"
           stroke="#C8A24A" stroke-width="2"/>
  <!-- rotated inner diamond -->
  <polygon points="400,130 510,250 400,370 290,250"
           fill="#C8A24A" fill-opacity="0.04"
           stroke="#C8A24A" stroke-width="1"/>
  <!-- inner square -->
  <rect x="362" y="212" width="76" height="76"
        fill="#C8A24A" fill-opacity="0.12"
        stroke="#C8A24A" stroke-width="1.5"
        transform="rotate(45,400,250)"/>
  <!-- center fill -->
  <rect x="382" y="232" width="36" height="36"
        fill="#C8A24A" opacity="0.5"
        transform="rotate(45,400,250)"/>

  <!-- cross hair fine lines -->
  <line x1="220" y1="250" x2="580" y2="250" stroke="#C8A24A" stroke-width="0.5" opacity="0.15"/>
  <line x1="400" y1="70" x2="400" y2="430" stroke="#C8A24A" stroke-width="0.5" opacity="0.15"/>

  <!-- corner registration marks -->
  <rect x="54" y="54" width="20" height="1" fill="#C8A24A" opacity="0.3"/>
  <rect x="54" y="54" width="1" height="20" fill="#C8A24A" opacity="0.3"/>
  <rect x="726" y="54" width="20" height="1" fill="#C8A24A" opacity="0.3"/>
  <rect x="745" y="54" width="1" height="20" fill="#C8A24A" opacity="0.3"/>
  <rect x="54" y="446" width="20" height="1" fill="#C8A24A" opacity="0.3"/>
  <rect x="54" y="426" width="1" height="20" fill="#C8A24A" opacity="0.3"/>
  <rect x="726" y="446" width="20" height="1" fill="#C8A24A" opacity="0.3"/>
  <rect x="745" y="426" width="1" height="20" fill="#C8A24A" opacity="0.3"/>

  <!-- brand name below mark -->
  <rect x="310" y="440" width="180" height="1" fill="#C8A24A" opacity="0.25"/>
  <rect x="322" y="455" width="156" height="14" rx="2" fill="#EFE9DD" opacity="0.7"/>
  <rect x="352" y="475" width="96" height="7" rx="2" fill="#B7B0A2" opacity="0.4"/>

  <!-- top meta text left -->
  <rect x="60" y="60" width="48" height="6" rx="2" fill="#6F6A5E" opacity="0.5"/>
  <rect x="116" y="60" width="6" height="6" rx="1" fill="#C8A24A" opacity="0.6"/>
  <rect x="130" y="60" width="60" height="6" rx="2" fill="#6F6A5E" opacity="0.35"/>

  <!-- top meta text right -->
  <rect x="680" y="60" width="60" height="6" rx="2" fill="#6F6A5E" opacity="0.35"/>
</svg>
