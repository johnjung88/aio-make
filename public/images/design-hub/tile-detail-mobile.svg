<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1810"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CEBA"/>
      <stop offset="100%" stop-color="#C8A07A"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="14" stdDeviation="24" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- ambient glow -->
  <ellipse cx="380" cy="240" rx="260" ry="220" fill="#C8A24A" fill-opacity="0.06"/>
  <ellipse cx="160" cy="380" rx="180" ry="140" fill="#C66060" fill-opacity="0.06"/>

  <!-- phone frame -->
  <g filter="url(#sh)">
    <rect x="272" y="24" width="200" height="452" rx="24" fill="#0E0D0B" stroke="#2A2520" stroke-width="1.5"/>
  </g>
  <!-- screen -->
  <rect x="282" y="52" width="180" height="388" fill="#F4ECDC"/>
  <!-- notch -->
  <rect x="332" y="52" width="60" height="10" rx="5" fill="#0E0D0B"/>

  <!-- hero image area on screen -->
  <rect x="282" y="62" width="180" height="128" fill="url(#hero)"/>
  <!-- product bottle silhouette -->
  <ellipse cx="372" cy="108" rx="16" ry="42" fill="#C8A24A" opacity="0.45"/>
  <rect x="364" y="70" width="16" height="10" rx="5" fill="#A08030" opacity="0.5"/>

  <!-- content area -->
  <rect x="290" y="198" width="72" height="6" rx="3" fill="#1A1612" opacity="0.45"/>
  <rect x="290" y="210" width="148" height="13" rx="2" fill="#1A1612" opacity="0.8"/>
  <rect x="290" y="229" width="58" height="10" rx="2" fill="#C66060" opacity="0.75"/>
  <rect x="290" y="248" width="164" height="0.5" fill="#1A1612" opacity="0.12"/>
  <rect x="290" y="258" width="100" height="6" rx="2" fill="#4B413A" opacity="0.38"/>
  <rect x="290" y="271" width="118" height="6" rx="2" fill="#4B413A" opacity="0.32"/>
  <rect x="290" y="284" width="84" height="6" rx="2" fill="#4B413A" opacity="0.27"/>
  <!-- rating -->
  <rect x="290" y="300" width="76" height="8" rx="4" fill="#C8A24A" opacity="0.55"/>
  <rect x="374" y="302" width="42" height="5" rx="2" fill="#7D7568" opacity="0.4"/>
  <!-- cta button -->
  <rect x="290" y="320" width="164" height="34" rx="3" fill="#1A1612"/>
  <rect x="334" y="331" width="76" height="10" rx="5" fill="#F4ECDC" opacity="0.6"/>
  <!-- home indicator -->
  <rect x="334" y="374" width="76" height="4" rx="2" fill="#1A1612" opacity="0.2"/>

  <!-- floating price tag right -->
  <rect x="528" y="130" width="140" height="64" rx="2" fill="#F4ECDC" opacity="0.93" filter="url(#sh)"/>
  <rect x="542" y="144" width="52" height="6" rx="2" fill="#7D7568" opacity="0.55"/>
  <rect x="542" y="156" width="100" height="13" rx="2" fill="#C66060" opacity="0.65"/>
  <rect x="542" y="175" width="68" height="6" rx="2" fill="#4B413A" opacity="0.45"/>

  <!-- left label stack -->
  <rect x="60" y="160" width="1" height="180" fill="#C8A24A" opacity="0.25"/>
  <rect x="76" y="200" width="56" height="7" rx="2" fill="#EFE9DD" opacity="0.45"/>
  <rect x="76" y="214" width="80" height="10" rx="2" fill="#EFE9DD" opacity="0.6"/>
  <rect x="76" y="230" width="48" height="6" rx="2" fill="#7D7568" opacity="0.35"/>

  <!-- bottom metric strip -->
  <rect x="528" y="260" width="140" height="0.5" fill="#C8A24A" opacity="0.3"/>
  <rect x="528" y="274" width="64" height="9" rx="2" fill="#C8A24A" opacity="0.5"/>
  <rect x="600" y="276" width="48" height="6" rx="2" fill="#7D7568" opacity="0.4"/>
  <rect x="528" y="292" width="96" height="6" rx="2" fill="#7D7568" opacity="0.3"/>
</svg>
