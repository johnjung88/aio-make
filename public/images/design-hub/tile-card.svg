<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#0C0A08"/>
    </linearGradient>
    <filter id="sh1"><feDropShadow dx="0" dy="16" stdDeviation="28" flood-opacity="0.65"/></filter>
    <filter id="sh2"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- warm ambient -->
  <ellipse cx="400" cy="260" rx="300" ry="220" fill="#C8A24A" fill-opacity="0.05"/>

  <!-- back card (rotated +7deg) -->
  <g filter="url(#sh2)" transform="rotate(7,400,250)">
    <rect x="140" y="130" width="520" height="240" rx="3" fill="#EEDEC2"/>
  </g>

  <!-- mid card (rotated -3deg) -->
  <g filter="url(#sh2)" transform="rotate(-3,400,250)">
    <rect x="130" y="150" width="520" height="240" rx="3" fill="#EAD9BF"/>
  </g>

  <!-- front card (straight) -->
  <g filter="url(#sh1)">
    <rect x="120" y="170" width="520" height="240" rx="3" fill="#F4ECDC"/>
  </g>
  <!-- front card inner border -->
  <rect x="134" y="184" width="492" height="212" rx="1" fill="none" stroke="#1A1612" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- card content -->
  <!-- geometric mark top-left -->
  <polygon points="160,208 192,208 176,232" fill="none" stroke="#1A1612" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="176" cy="214" r="6" fill="none" stroke="#C8A24A" stroke-width="1.5"/>

  <!-- name block -->
  <rect x="218" y="202" width="160" height="16" rx="3" fill="#1A1612" opacity="0.7"/>
  <rect x="218" y="224" width="110" height="9" rx="2" fill="#4B413A" opacity="0.42"/>

  <!-- divider -->
  <rect x="134" y="268" width="492" height="0.5" fill="#1A1612" opacity="0.1"/>

  <!-- contact rows -->
  <rect x="148" y="284" width="108" height="8" rx="2" fill="#4B413A" opacity="0.38"/>
  <rect x="148" y="300" width="136" height="8" rx="2" fill="#4B413A" opacity="0.32"/>
  <rect x="148" y="316" width="88" height="8" rx="2" fill="#4B413A" opacity="0.27"/>

  <!-- right side: URL + tag -->
  <rect x="524" y="284" width="80" height="8" rx="2" fill="#C8A24A" opacity="0.45"/>
  <rect x="524" y="300" width="60" height="7" rx="2" fill="#7D7568" opacity="0.35"/>

  <!-- bottom-right mark -->
  <rect x="546" y="345" width="66" height="14" rx="2" fill="#1A1612" opacity="0.08"/>
  <rect x="556" y="349" width="46" height="6" rx="2" fill="#7D7568" opacity="0.4"/>

  <!-- ambient text left -->
  <rect x="60" y="140" width="1" height="220" fill="#C8A24A" opacity="0.2"/>
  <rect x="78" y="196" width="36" height="6" rx="2" fill="#6F6A5E" opacity="0.4"/>
  <rect x="78" y="210" width="50" height="9" rx="2" fill="#B7B0A2" opacity="0.45"/>
  <rect x="78" y="226" width="30" height="5" rx="2" fill="#6F6A5E" opacity="0.28"/>

  <!-- ambient text right -->
  <rect x="690" y="196" width="50" height="6" rx="2" fill="#6F6A5E" opacity="0.35"/>
  <rect x="690" y="210" width="36" height="6" rx="2" fill="#6F6A5E" opacity="0.25"/>

  <!-- top rule -->
  <rect x="60" y="64" width="680" height="0.5" fill="#C8A24A" opacity="0.2"/>
  <!-- bottom rule -->
  <rect x="60" y="436" width="680" height="0.5" fill="#C8A24A" opacity="0.2"/>
</svg>
