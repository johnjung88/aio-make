<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- cream paper background -->
  <rect width="800" height="500" fill="#F0E6D2"/>
  <rect width="800" height="500" fill="#EEDECA" fill-opacity="0.5"/>
  <!-- paper texture hint -->
  <rect x="0" y="0" width="800" height="1" fill="#1A1612" opacity="0.08"/>
  <rect x="0" y="499" width="800" height="1" fill="#1A1612" opacity="0.08"/>

  <!-- LEFT: large brand mark -->
  <!-- geometric letterform: outer square + inner diamond -->
  <rect x="60" y="60" width="260" height="260" fill="none" stroke="#1A1612" stroke-width="1" opacity="0.15"/>
  <!-- diamond inside square -->
  <polygon points="190,80 300,190 190,300 80,190" fill="#1A1612" fill-opacity="0.04" stroke="#1A1612" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- center circle -->
  <circle cx="190" cy="190" r="52" fill="none" stroke="#C8A24A" stroke-width="2.5"/>
  <circle cx="190" cy="190" r="28" fill="#C8A24A" fill-opacity="0.18"/>
  <circle cx="190" cy="190" r="8" fill="#C8A24A" opacity="0.7"/>
  <!-- cross lines -->
  <line x1="60" y1="190" x2="320" y2="190" stroke="#1A1612" stroke-width="0.5" opacity="0.1"/>
  <line x1="190" y1="60" x2="190" y2="320" stroke="#1A1612" stroke-width="0.5" opacity="0.1"/>

  <!-- brand name area -->
  <rect x="60" y="344" width="12" height="12" fill="#C8A24A"/>
  <rect x="84" y="346" width="120" height="14" rx="2" fill="#1A1612" opacity="0.8"/>
  <rect x="84" y="366" width="80" height="8" rx="2" fill="#4B413A" opacity="0.45"/>

  <!-- vertical divider -->
  <rect x="370" y="40" width="0.5" height="420" fill="#1A1612" opacity="0.1"/>

  <!-- RIGHT: identity system -->
  <!-- typography specimen -->
  <rect x="410" y="60" width="220" height="1" fill="#1A1612" opacity="0.15"/>
  <rect x="410" y="78" width="300" height="32" rx="2" fill="#1A1612" opacity="0.08"/>
  <rect x="410" y="78" width="300" height="32" rx="2" fill="none" stroke="#1A1612" stroke-width="0.5" stroke-opacity="0.1"/>
  <!-- big heading simulation -->
  <rect x="420" y="86" width="200" height="18" rx="3" fill="#1A1612" opacity="0.65"/>
  <rect x="410" y="124" width="180" height="1" fill="#C8A24A" opacity="0.5"/>

  <!-- type scale rows -->
  <rect x="410" y="140" width="240" height="14" rx="2" fill="#1A1612" opacity="0.45"/>
  <rect x="410" y="160" width="180" height="10" rx="2" fill="#1A1612" opacity="0.32"/>
  <rect x="410" y="176" width="210" height="8" rx="2" fill="#1A1612" opacity="0.25"/>
  <rect x="410" y="190" width="150" height="7" rx="2" fill="#4B413A" opacity="0.2"/>

  <!-- color palette -->
  <rect x="410" y="230" width="1" height="80" fill="#1A1612" opacity="0.1"/>
  <rect x="420" y="226" width="36" height="36" rx="2" fill="#1A1612"/>
  <rect x="462" y="226" width="36" height="36" rx="2" fill="#C8A24A"/>
  <rect x="504" y="226" width="36" height="36" rx="2" fill="#F4ECDC" stroke="#1A1612" stroke-width="0.5" stroke-opacity="0.2"/>
  <rect x="546" y="226" width="36" height="36" rx="2" fill="#C66060"/>
  <rect x="588" y="226" width="36" height="36" rx="2" fill="#4B413A"/>
  <rect x="632" y="226" width="36" height="36" rx="2" fill="#7D7568"/>
  <rect x="420" y="274" width="56" height="6" rx="2" fill="#4B413A" opacity="0.35"/>
  <rect x="420" y="286" width="40" height="5" rx="2" fill="#7D7568" opacity="0.3"/>

  <!-- grid/layout specimen -->
  <rect x="410" y="328" width="145" height="96" rx="1" fill="#1A1612" fill-opacity="0.05" stroke="#1A1612" stroke-width="0.5" stroke-opacity="0.15"/>
  <rect x="565" y="328" width="145" height="96" rx="1" fill="#C8A24A" fill-opacity="0.12" stroke="#C8A24A" stroke-width="0.5" stroke-opacity="0.4"/>
  <rect x="424" y="344" width="100" height="8" rx="2" fill="#1A1612" opacity="0.4"/>
  <rect x="424" y="358" width="70" height="6" rx="2" fill="#4B413A" opacity="0.28"/>
  <rect x="424" y="370" width="84" height="6" rx="2" fill="#4B413A" opacity="0.22"/>
  <rect x="579" y="344" width="88" height="8" rx="2" fill="#C8A24A" opacity="0.6"/>
  <rect x="579" y="358" width="64" height="6" rx="2" fill="#C8A24A" opacity="0.35"/>

  <!-- bottom label -->
  <rect x="60" y="450" width="680" height="0.5" fill="#1A1612" opacity="0.1"/>
  <rect x="60" y="464" width="120" height="7" rx="2" fill="#7D7568" opacity="0.5"/>
  <rect x="196" y="466" width="8" height="3" rx="1" fill="#C66060" opacity="0.5"/>
  <rect x="212" y="464" width="80" height="7" rx="2" fill="#7D7568" opacity="0.35"/>
  <rect x="640" y="464" width="100" height="7" rx="2" fill="#7D7568" opacity="0.35"/>
</svg>
