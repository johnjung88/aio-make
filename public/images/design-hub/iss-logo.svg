<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <defs>
    <radialGradient id="bg" cx="35%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1808"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
    <filter id="cs"><feDropShadow dx="0" dy="14" stdDeviation="26" flood-opacity="0.6"/></filter>
    <filter id="cs2"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="800" height="640" fill="url(#bg)"/>

  <!-- top rule -->
  <rect x="60" y="48" width="680" height="0.5" fill="#C8A24A" opacity="0.22"/>

  <!-- LEFT: Brand mark (centered at ~210, 280) -->
  <!-- outer ring -->
  <circle cx="210" cy="290" r="150" fill="none" stroke="#C8A24A" stroke-width="0.75" opacity="0.18"/>
  <circle cx="210" cy="290" r="110" fill="none" stroke="#C8A24A" stroke-width="1" opacity="0.28"/>
  <!-- main diamond -->
  <polygon points="210,154 330,290 210,426 90,290"
           fill="#C8A24A" fill-opacity="0.06"
           stroke="#C8A24A" stroke-width="2"/>
  <!-- inner rotated square -->
  <rect x="176" y="256" width="68" height="68"
        fill="#C8A24A" fill-opacity="0.1"
        stroke="#C8A24A" stroke-width="1.5"
        transform="rotate(45,210,290)"/>
  <!-- inner fill square -->
  <rect x="194" y="274" width="32" height="32"
        fill="#C8A24A" opacity="0.45"
        transform="rotate(45,210,290)"/>
  <!-- center dot -->
  <circle cx="210" cy="290" r="5" fill="#C8A24A" opacity="0.8"/>

  <!-- cross lines -->
  <line x1="80" y1="290" x2="340" y2="290" stroke="#C8A24A" stroke-width="0.5" opacity="0.12"/>
  <line x1="210" y1="160" x2="210" y2="420" stroke="#C8A24A" stroke-width="0.5" opacity="0.12"/>

  <!-- brand name simulation below mark -->
  <rect x="100" y="466" width="8" height="8" fill="#C8A24A"/>
  <rect x="118" y="468" width="96" height="12" rx="2" fill="#EFE9DD" opacity="0.82"/>
  <rect x="118" y="486" width="68" height="7" rx="2" fill="#B7B0A2" opacity="0.42"/>

  <!-- color palette row -->
  <rect x="100" y="540" width="16" height="16" rx="8" fill="#1A1612"/>
  <rect x="126" y="540" width="16" height="16" rx="8" fill="#C8A24A"/>
  <rect x="152" y="540" width="16" height="16" rx="8" fill="#F4ECDC"/>
  <rect x="178" y="540" width="16" height="16" rx="8" fill="#C66060"/>
  <rect x="204" y="540" width="16" height="16" rx="8" fill="#4B413A"/>
  <rect x="234" y="544" width="56" height="7" rx="2" fill="#6F6A5E" opacity="0.38"/>

  <!-- vertical divider -->
  <rect x="388" y="56" width="0.5" height="528" fill="#C8A24A" opacity="0.1"/>

  <!-- RIGHT: business cards stack -->
  <!-- back card rotated -->
  <g filter="url(#cs2)" transform="rotate(9,614,318)">
    <rect x="448" y="168" width="280" height="172" rx="2" fill="#EEDEC2"/>
  </g>
  <!-- mid card -->
  <g filter="url(#cs2)" transform="rotate(-2,614,318)">
    <rect x="440" y="198" width="280" height="172" rx="2" fill="#EAD9BF"/>
  </g>
  <!-- front card -->
  <g filter="url(#cs)">
    <rect x="432" y="228" width="280" height="172" rx="2" fill="#F4ECDC"/>
  </g>
  <!-- front card inner border -->
  <rect x="446" y="242" width="252" height="144" fill="none" stroke="#1A1612" stroke-width="0.5" stroke-opacity="0.12"/>

  <!-- card mark -->
  <polygon points="470,266 492,266 481,282" fill="none" stroke="#1A1612" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="481" cy="272" r="5" fill="none" stroke="#C8A24A" stroke-width="1.5"/>

  <!-- card name -->
  <rect x="506" y="258" width="148" height="13" rx="2" fill="#1A1612" opacity="0.7"/>
  <rect x="506" y="277" width="104" height="8" rx="2" fill="#4B413A" opacity="0.4"/>

  <!-- card divider -->
  <rect x="446" y="312" width="252" height="0.5" fill="#1A1612" opacity="0.1"/>

  <!-- contact rows -->
  <rect x="454" y="326" width="104" height="7" rx="2" fill="#4B413A" opacity="0.36"/>
  <rect x="454" y="340" width="128" height="7" rx="2" fill="#4B413A" opacity="0.3"/>
  <rect x="454" y="354" width="82" height="7" rx="2" fill="#4B413A" opacity="0.25"/>
  <!-- URL right -->
  <rect x="624" y="354" width="56" height="7" rx="2" fill="#C8A24A" opacity="0.45"/>

  <!-- typography specimen below cards -->
  <rect x="432" y="448" width="280" height="0.5" fill="#C8A24A" opacity="0.22"/>
  <rect x="432" y="464" width="196" height="14" rx="2" fill="#EFE9DD" opacity="0.52"/>
  <rect x="432" y="484" width="144" height="8" rx="2" fill="#B7B0A2" opacity="0.32"/>
  <rect x="432" y="498" width="100" height="7" rx="2" fill="#7D7568" opacity="0.24"/>

  <!-- bottom rule -->
  <rect x="60" y="592" width="680" height="0.5" fill="#C8A24A" opacity="0.18"/>

  <!-- corner tags -->
  <rect x="60" y="60" width="50" height="6" rx="2" fill="#6F6A5E" opacity="0.42"/>
  <rect x="118" y="60" width="8" height="6" rx="2" fill="#C66060" opacity="0.5"/>
  <rect x="134" y="60" width="50" height="6" rx="2" fill="#6F6A5E" opacity="0.28"/>
  <rect x="696" y="60" width="44" height="6" rx="2" fill="#6F6A5E" opacity="0.28"/>
</svg>
