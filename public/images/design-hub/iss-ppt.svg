<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="slide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1428"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <filter id="gs"><feDropShadow dx="0" dy="16" stdDeviation="30" flood-opacity="0.65"/></filter>
  </defs>
  <rect width="800" height="640" fill="url(#bg)"/>
  <!-- ambient gold glow -->
  <ellipse cx="400" cy="300" rx="320" ry="260" fill="#C8A24A" fill-opacity="0.04"/>

  <!-- main slide (16:9 proportioned, centered) -->
  <g filter="url(#gs)">
    <rect x="64" y="80" width="672" height="378" rx="3" fill="url(#slide)"/>
  </g>
  <!-- slide inner border -->
  <rect x="76" y="92" width="648" height="354" fill="none" stroke="#C8A24A" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- slide: top meta bar -->
  <rect x="88" y="104" width="48" height="6" rx="2" fill="#6F6A5E" opacity="0.5"/>
  <rect x="144" y="104" width="6" height="6" rx="1" fill="#C8A24A" opacity="0.5"/>
  <rect x="158" y="104" width="60" height="6" rx="2" fill="#6F6A5E" opacity="0.35"/>
  <!-- right meta -->
  <rect x="664" y="104" width="48" height="6" rx="2" fill="#6F6A5E" opacity="0.35"/>

  <!-- top gold rule -->
  <rect x="88" y="120" width="624" height="1" fill="#C8A24A" opacity="0.35"/>

  <!-- large heading area -->
  <rect x="88" y="144" width="440" height="40" rx="3" fill="#EFE9DD" opacity="0.82"/>
  <rect x="88" y="192" width="280" height="24" rx="2" fill="#EFE9DD" opacity="0.42"/>
  <rect x="88" y="222" width="200" height="14" rx="2" fill="#C8A24A" opacity="0.55"/>

  <!-- middle rule -->
  <rect x="88" y="252" width="624" height="0.5" fill="#C8A24A" opacity="0.2"/>

  <!-- 3 metric boxes -->
  <!-- box 1 -->
  <rect x="88" y="268" width="186" height="96" rx="2" fill="#C8A24A" fill-opacity="0.08" stroke="#C8A24A" stroke-width="0.75" stroke-opacity="0.3"/>
  <rect x="102" y="284" width="80" height="36" rx="2" fill="#C8A24A" opacity="0.5"/>
  <rect x="102" y="326" width="100" height="8" rx="2" fill="#B7B0A2" opacity="0.38"/>

  <!-- box 2 -->
  <rect x="291" y="268" width="186" height="96" rx="2" fill="#C8A24A" fill-opacity="0.06" stroke="#C8A24A" stroke-width="0.75" stroke-opacity="0.22"/>
  <rect x="305" y="284" width="80" height="36" rx="2" fill="#EFE9DD" opacity="0.35"/>
  <rect x="305" y="326" width="100" height="8" rx="2" fill="#B7B0A2" opacity="0.35"/>

  <!-- box 3 -->
  <rect x="494" y="268" width="218" height="96" rx="2" fill="#C66060" fill-opacity="0.08" stroke="#C66060" stroke-width="0.75" stroke-opacity="0.25"/>
  <rect x="508" y="284" width="80" height="36" rx="2" fill="#C66060" opacity="0.4"/>
  <rect x="508" y="326" width="120" height="8" rx="2" fill="#B7B0A2" opacity="0.35"/>

  <!-- bottom rule on slide -->
  <rect x="88" y="380" width="624" height="0.5" fill="#C8A24A" opacity="0.18"/>

  <!-- slide footer: name + date -->
  <rect x="88" y="392" width="140" height="8" rx="2" fill="#6F6A5E" opacity="0.45"/>
  <rect x="248" y="394" width="6" height="4" rx="1" fill="#C8A24A" opacity="0.45"/>
  <rect x="262" y="392" width="80" height="8" rx="2" fill="#6F6A5E" opacity="0.32"/>
  <!-- confidential badge right -->
  <rect x="628" y="388" width="84" height="16" rx="2" fill="#C8A24A" fill-opacity="0.12" stroke="#C8A24A" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="640" y="392" width="60" height="7" rx="2" fill="#C8A24A" opacity="0.55"/>

  <!-- slide number -->
  <rect x="88" y="408" width="32" height="22" rx="2" fill="#EFE9DD" fill-opacity="0.06" stroke="#EFE9DD" stroke-width="0.5" stroke-opacity="0.15"/>
  <rect x="96" y="415" width="16" height="8" rx="2" fill="#EFE9DD" opacity="0.3"/>

  <!-- below slide: session info -->
  <rect x="64" y="490" width="280" height="0.5" fill="#C8A24A" opacity="0.18"/>
  <rect x="64" y="506" width="96" height="8" rx="2" fill="#6F6A5E" opacity="0.4"/>
  <rect x="168" y="506" width="50" height="8" rx="2" fill="#C8A24A" opacity="0.35"/>

  <!-- slide shadow decorative right info -->
  <rect x="520" y="490" width="216" height="0.5" fill="#C8A24A" opacity="0.18"/>
  <rect x="520" y="506" width="120" height="8" rx="2" fill="#6F6A5E" opacity="0.38"/>
  <rect x="652" y="506" width="64" height="8" rx="2" fill="#6F6A5E" opacity="0.28"/>

  <!-- bottom rule -->
  <rect x="64" y="580" width="672" height="0.5" fill="#C8A24A" opacity="0.15"/>
  <rect x="64" y="596" width="140" height="7" rx="2" fill="#6F6A5E" opacity="0.35"/>
  <rect x="596" y="596" width="140" height="7" rx="2" fill="#6F6A5E" opacity="0.28"/>
</svg>
