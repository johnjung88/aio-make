<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660">
  <defs>
    <linearGradient id="mac-lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#656870"/>
      <stop offset="45%"  stop-color="#4a4d55"/>
      <stop offset="100%" stop-color="#383c43"/>
    </linearGradient>
    <linearGradient id="mac-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c2f36"/>
      <stop offset="100%" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="mac-hinge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#08090c"/>
      <stop offset="50%"  stop-color="#383c43"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="mac-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a4d55"/>
      <stop offset="100%" stop-color="#2c2f36"/>
    </linearGradient>
    <filter id="mac-drop" x="-8%" y="-4%" width="116%" height="125%">
      <feDropShadow dx="0" dy="32" stdDeviation="44" flood-color="#000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <!-- Lid body -->
  <rect x="20" y="0" width="960" height="600" rx="20" ry="20"
        fill="url(#mac-lid)" stroke="rgba(0,0,0,0.45)" stroke-width="0.6"
        filter="url(#mac-drop)"/>

  <!-- Top-edge highlight (aluminum sheen) -->
  <rect x="21" y="1" width="958" height="2" rx="1"
        fill="rgba(255,255,255,0.16)"/>

  <!-- Inner screen bezel (dark surround) -->
  <rect x="42" y="14" width="916" height="574" rx="11" ry="11"
        fill="url(#mac-bezel)"/>

  <!-- Screen area — content overlaid here in code -->
  <rect x="55" y="30" width="890" height="540" rx="5" ry="5"
        fill="#050508"/>

  <!-- Camera notch bar -->
  <rect x="466" y="0" width="68" height="16" rx="0" fill="#393c42"/>
  <!-- Camera lens -->
  <circle cx="490" cy="8" r="2.8"
          fill="#18191e" stroke="rgba(255,255,255,0.09)" stroke-width="0.4"/>
  <!-- Mic -->
  <circle cx="510" cy="8" r="1.3" fill="#18191e"/>

  <!-- Lid bottom strip (before hinge) -->
  <rect x="20" y="594" width="960" height="6" rx="0"
        fill="rgba(0,0,0,0.28)"/>

  <!-- Hinge -->
  <rect x="0" y="600" width="1000" height="4"
        fill="url(#mac-hinge)"/>

  <!-- Base (trapezoid) -->
  <path d="M 0 604 L 1000 604 L 986 652 L 14 652 Z"
        fill="url(#mac-base)"/>
  <line x1="1" y1="605" x2="999" y2="605"
        stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Trackpad indent (subtle) -->
  <rect x="390" y="621" width="220" height="17" rx="4"
        fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="0.5"/>

  <!-- Speaker grille slot -->
  <rect x="382" y="648" width="236" height="3" rx="1.5"
        fill="#1a1c22"/>

  <!-- Ground shadow -->
  <ellipse cx="500" cy="658" rx="355" ry="4.5"
           fill="rgba(0,0,0,0.38)"/>
</svg>
