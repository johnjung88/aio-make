<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0D0D12;color:#fff;font-family:'Pretendard Variable',Pretendard,sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:#A99BFF}
input,textarea,button{font-family:inherit}
textarea::placeholder,input::placeholder{color:#8A8A94}
p,blockquote,[style*="text-align:justify"]{text-align:justify;word-break:keep-all;text-wrap:pretty}
</style>
<script src="./fit-lines.js"></script>
</helmet>
<div style="background:#0D0D12;min-height:100vh;display:flex;flex-direction:column">
<dc-import name="AioHeader" active="lab" hint-size="100%,72px"></dc-import>
<dc-import name="LabNav" active="contact" hint-size="100%,56px"></dc-import>

<section style="max-width:1440px;width:100%;box-sizing:border-box;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(20px,4vw,56px) clamp(80px,10vw,140px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px clamp(40px,6vw,96px)">
  <div style="display:flex;flex-direction:column;gap:22px;align-self:start">
    <span style="font-family:'JetBrains Mono','Pretendard Variable',Pretendard,monospace;font-size:13px;letter-spacing:.14em;color:#A99BFF">START A PROJECT</span>
    <div data-fit="balance" style="width:fit-content;max-width:100%"><h1 style="margin:0;font-size:clamp(34px,4.4vw,60px);letter-spacing:-.04em;font-weight:800;line-height:1.16"><span data-fit-line="">만들고 싶은 것을 알려주시면</span><span data-fit-line=""><span style="color:#A99BFF">범위와 일정</span>을 먼저 공유드립니다</span></h1></div>
    <p style="text-align:justify;margin:0;font-size:17px;line-height:1.75;color:#B5B5BD">참고 사이트나 지금 쓰는 엑셀 파일이 있으면 함께 알려주세요. 개발자가 직접 확인하고 24시간 안에 연락드립니다</p>
    <div style="display:flex;flex-direction:column;border-top:1px solid #3A3A46;margin-top:8px">
      <sc-for list="{{ terms }}" as="t" hint-placeholder-count="5"><div style="display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #2E2E38;font-size:15px"><span style="color:#B5B5BD">{{ t.k }}</span><strong style="font-weight:600;text-align:right">{{ t.v }}</strong></div></sc-for>
    </div>
    <div style="background:#16161C;border:1px solid #2E2E38;padding:20px 22px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'JetBrains Mono','Pretendard Variable',Pretendard,monospace;font-size:11px;letter-spacing:.1em;color:#A99BFF">예상 납기</span><strong style="font-size:22px;letter-spacing:-.02em">{{ estimate }}</strong><span style="font-size:13.5px;color:#B5B5BD">{{ estimateNote }}</span></div>
  </div>
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="border:1px solid #A99BFF;background:#1C1C22;padding:40px;display:flex;flex-direction:column;gap:12px;justify-content:center;align-self:start"><span style="font-family:'JetBrains Mono','Pretendard Variable',Pretendard,monospace;font-size:12px;color:#A99BFF">RECEIVED</span><strong style="font-size:26px">문의가 접수되었습니다</strong><span style="text-align:justify;color:#B5B5BD;line-height:1.7">개발자가 요청 내용을 확인한 뒤 24시간 안에 연락드립니다. 견적이 확정되면 작업 전에 범위와 일정을 먼저 공유드립니다</span></div>
  </sc-if>
  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:26px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:#B5B5BD">{{ g.label }}
          <div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="4"><button type="button" onClick="{{ o.pick }}" style="cursor:pointer;padding:10px 16px;font-size:15px;border-radius:999px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sc-for></div>
        </div>
      </sc-for>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#B5B5BD">{{ refLabel }}<input placeholder="{{ refPh }}" style="border:none;border-bottom:1.5px solid #3A3A46;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#B5B5BD">요청 내용<textarea rows="5" placeholder="{{ msgPh }}" style="border:1px solid #3A3A46;padding:16px;font-size:16px;line-height:1.7;outline:none;background:#16161C;color:#fff;resize:vertical"></textarea></label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px">
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#B5B5BD">고객명 *<input required="" placeholder="홍길동" style="border:none;border-bottom:1.5px solid #3A3A46;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#B5B5BD">연락처 *<input required="" type="tel" placeholder="010-0000-0000" style="border:none;border-bottom:1.5px solid #3A3A46;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      </div>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#B5B5BD">이메일 *<input required="" type="email" placeholder="name@company.com" style="border:none;border-bottom:1.5px solid #3A3A46;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:#B5B5BD;cursor:pointer"><input required="" type="checkbox" style="width:18px;height:18px;accent-color:#A99BFF">개인정보 수집·이용에 동의합니다 (필수)</label>
      <button type="submit" style="cursor:pointer;border:none;background:#6B4DFF;color:#fff;padding:20px;font-size:16px;font-weight:700">견적 요청 보내기</button>
    </form>
  </sc-if>
</section>
<dc-import name="AioFooter" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MAP = { website: '웹사이트 제작', shop: '카페24 쇼핑몰', automation: '업무 자동화', program: '프로그램 개발' };
const FEAT = { web: ['문의 폼', '예약', '결제', '회원가입·로그인', '게시판·공지', '관리자 페이지', '아직 모르겠어요'], shop: ['템플릿 복사 (150,000원)', '풀세트 (300,000원)', '아직 모르겠어요'], auto: ['데이터 수집', '엑셀·시트 정리', '알림 발송', '외부 API 연동', '관리자 화면', 'AI 챗봇', '아직 모르겠어요'] };
const HAVE = ['로고', '원고·소개 자료', '사진', '도메인', '참고 사이트', '샘플 파일'];
class Component extends DCLogic {
  state = { service: (() => { try { return MAP[new URLSearchParams(location.search).get('s')] || ''; } catch (e) { return ''; } })(), feat: [], have: [], sent: false };
  renderVals() {
    const sv = this.state.service, isAuto = sv === '업무 자동화' || sv === '프로그램 개발', isShop = sv === '카페24 쇼핑몰';
    const G = [['service', '만들고 싶은 것 *', [...Object.values(MAP), '아직 모르겠어요'], false], ['feat', '필요한 기능 (여러 개 선택 가능)', isAuto ? FEAT.auto : isShop ? FEAT.shop : FEAT.web, true], ['have', '준비된 자료 (여러 개 선택 가능)', HAVE, true]];
    return {
      terms: [['견적 안내', '24시간 이내'], ['진행 공유', '작업 전 · 작업 끝난 후'], ['결제', '착수 50% · 납품 50%'], ['착수', '착수금 확인 다음 날'], ['무상 A/S', '납품 후 1달']].map(([k, v]) => ({ k, v })),
      estimate: !sv || sv === '아직 모르겠어요' ? '평균 7일' : isAuto ? '평균 10일' : '평균 2일',
      estimateNote: !sv || sv === '아직 모르겠어요' ? '프로젝트마다 다르며, 작업 전 공유 때 확정합니다' : sv === '웹사이트 제작' ? '1~20페이지 150,000원 (부가세 별도)' : isShop ? '템플릿 복사 150,000원 · 풀세트 300,000원' : '요청별 개별 견적 · 기능 범위에 따라 달라집니다',
      groups: G.map(([key, label, opts, multi]) => ({ label, opts: opts.map(o => {
        const on = multi ? this.state[key].includes(o) : this.state[key] === o;
        return { label: o, bg: on ? '#A99BFF' : 'transparent', fg: on ? '#0D0D12' : '#E4E4EA', bd: on ? '#A99BFF' : '#3A3A46',
          pick: () => this.setState(s => multi ? { [key]: on ? s[key].filter(x => x !== o) : [...s[key], o] } : { service: o, feat: [] }) };
      }) })),
      refLabel: isAuto ? '지금 쓰는 도구·파일' : '참고 사이트 URL',
      refPh: isAuto ? '엑셀, 구글 시트, 사용 중인 솔루션 이름 등' : isShop ? '참고하는 쇼핑몰 주소' : '비슷하게 만들고 싶은 사이트 주소',
      msgPh: isAuto ? '반복하는 작업 순서를 적어주세요. 예: 매일 아침 5개 마켓 가격을 복사해 엑셀에 정리합니다' : isShop ? '상품 수, 옵션 구성, 원하는 분위기를 적어주세요' : '업종, 필요한 페이지, 원하는 분위기를 자유롭게 적어주세요',
      sent: this.state.sent, notSent: !this.state.sent,
      submit: e => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
