<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&display=swap">
<style>
body{margin:0;background:#000;color:#fff;font-family:'Pretendard Variable',Pretendard,sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{color:#A99BFF}
input,textarea,button,select{font-family:inherit}
textarea::placeholder,input::placeholder{color:#6E6E78}
</style>
</helmet>
<div style="background:#000;min-height:100vh;display:flex;flex-direction:column">
<dc-import name="AioHeader" active="studio" hint-size="100%,72px"></dc-import>
<dc-import name="StudioNav" active="contact" hint-size="100%,56px"></dc-import>

<section style="max-width:1440px;width:100%;box-sizing:border-box;margin:0 auto;padding:clamp(56px,7vw,100px) clamp(20px,4vw,56px) clamp(80px,10vw,140px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:56px">
  <div style="display:flex;flex-direction:column;gap:20px">
    <span style="font-family:Unbounded,sans-serif;font-size:12px;letter-spacing:.16em;color:#A99BFF">START A PROJECT</span>
    <h1 style="margin:0;font-size:clamp(36px,5vw,68px);letter-spacing:-.04em;font-weight:800;line-height:1.08">어떤 영상이<br>필요하신가요</h1>
    <p style="margin:0;font-size:17px;line-height:1.75;color:#C9C9D1">자세히 적어주실수록 <strong style="color:#A99BFF">견적이 정확해집니다</strong><br>영상 담당자가 확인 후 연락드립니다</p>
  </div>
  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="border:1px solid #6B4DFF;padding:40px;display:flex;flex-direction:column;gap:12px;justify-content:center"><strong style="font-size:24px">문의가 접수되었습니다</strong><span style="color:#C9C9D1">영상 담당자가 확인 후 연락드리겠습니다</span></div>
  </sc-if>
  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:24px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px">
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#9A9AA3">고객명 *<input required="" placeholder="홍길동" style="border:none;border-bottom:1.5px solid #55555E;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#9A9AA3">연락처 *<input required="" type="tel" placeholder="010-0000-0000" style="border:none;border-bottom:1.5px solid #55555E;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      </div>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#9A9AA3">이메일 *<input required="" type="email" placeholder="name@company.com" style="border:none;border-bottom:1.5px solid #55555E;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:#9A9AA3">{{ g.label }}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-for list="{{ g.opts }}" as="o" hint-placeholder-count="4">
              <button type="button" onClick="{{ o.pick }}" style="cursor:pointer;padding:10px 16px;font-size:15px;border-radius:999px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:#fff">{{ o.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#9A9AA3">참고 영상 링크<input placeholder="https://" style="border:none;border-bottom:1.5px solid #55555E;padding:10px 0;font-size:17px;outline:none;background:transparent;color:#fff"></label>
      <label style="display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:#9A9AA3">요청 내용 *<textarea required="" rows="6" placeholder="회사·브랜드 소개와 영상의 목적을 자유롭게 적어주세요" style="border:1px solid #55555E;padding:16px;font-size:16px;line-height:1.7;outline:none;background:transparent;color:#fff;resize:vertical"></textarea></label>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:#C9C9D1;cursor:pointer"><input required="" type="checkbox" style="width:18px;height:18px;accent-color:#6B4DFF">개인정보 수집·이용에 동의합니다 (필수)</label>
      <button type="submit" style="cursor:pointer;border:none;background:#6B4DFF;color:#fff;padding:20px;font-size:16px;font-weight:600">문의 보내기</button>
    </form>
  </sc-if>
</section>
<dc-import name="AioFooter" hint-size="100%,300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MAP = { webtoon: '웹툰 (1회 70,000원)', animation: '애니메이션 (숏폼형 1회 100,000원)', 'ai-influencer': 'AI 인플루언서 영상 (1회 150,000원)', promo: '브랜드 홍보 영상 (1회 100,000원)', ad: 'SNS 광고 영상 (1회 100,000원)', edit: '편집·클리퍼 (별도 견적)' };
const G = [
  ['service', '요청 서비스 *', [...Object.values(MAP), '아직 모르겠어요']],
  ['purpose', '사용 목적', ['상세페이지', '광고 소재', '브랜드 소개', 'SNS 계정 운영', '기타']],
  ['assets', '보유 자료 (여러 개 선택 가능)', ['로고', '제품 사진·영상', '캐릭터', '시나리오·웹툰', '없음']],
  ['channel', '사용 채널 (여러 개 선택 가능)', ['유튜브', '인스타그램', '틱톡', '광고', '웹사이트', '행사·오프라인']],
  ['when', '희망 공개일', ['2주 이내', '1개월 이내', '2개월 이내', '협의']]
];
const MULTI = ['channel', 'assets'];
class Component extends DCLogic {
  state = { service: (typeof location !== 'undefined' && MAP[new URLSearchParams(location.search).get('s')]) || '', purpose: '', assets: [], channel: [], when: '', sent: false };
  renderVals() {
    return {
      groups: G.map(([key, label, opts]) => ({ label, opts: opts.map(o => {
        const multi = MULTI.includes(key);
        const on = multi ? this.state[key].includes(o) : this.state[key] === o;
        return { label: o, bg: on ? '#6B4DFF' : 'transparent', bd: on ? '#6B4DFF' : '#55555E',
          pick: () => this.setState(s => multi ? { [key]: on ? s[key].filter(x => x !== o) : [...s[key], o] } : { [key]: o }) };
      }) })),
      sent: this.state.sent, notSent: !this.state.sent,
      submit: e => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
